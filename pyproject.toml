[build-system]
requires = ["setuptools>=84.0.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "mediagrab"
version = "0.1.0"
description = "A Windows desktop video and audio downloader powered by yt-dlp and Qt."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["desktop", "media", "pyside6", "yt-dlp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.11.2,<6.12",
    "yt-dlp[default,curl-cffi]>=2026.8.19,<2027",
    "curl-cffi>=0.16.0,<0.17",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-qt>=4.5.0,<5",
    "ruff>=0.16.10,<0.17",
]
build = ["pyinstaller>=6.22.3,<7"]

[project.urls]
Repository = "https://github.com/mr-ransaz/media-downloader"
Issues = "https://github.com/mr-ransaz/media-downloader/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mediagrab*"]
namespaces = false

[tool.setuptools.package-data]
mediagrab = ["py.typed", "desktop/resources/*.qss", "desktop/resources/*.svg", "desktop/resources/*.ico"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ANN", "D", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
qt_api = "pyside6"
markers = ["network: requires explicit --run-network, Internet access, and FFmpeg"]

[tool.coverage.run]
branch = true
source = ["mediagrab.core"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
